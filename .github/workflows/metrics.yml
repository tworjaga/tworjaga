name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # daily, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tworjaga
          filename: metrics.svg
          committer_message: "Update GitHub metrics"
          config_timezone: Europe/Moscow
          config_display: large
          base: header, activity, community, repositories, metadata

          # Bio from your GitHub profile
          plugin_introduction: yes

          # Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Lines of code added/removed (totals only)
          plugin_lines: yes
          plugin_lines_sections: base

          # Issues & PRs opened/closed/merged
          plugin_followup: yes
          plugin_followup_sections: repositories, user

          # Your pinned repositories as cards
          plugin_repositories: yes
          plugin_repositories_pinned: 6

          # Recently starred repos
          plugin_stars: yes
          plugin_stars_limit: 4

          # Yearly contribution calendars
          plugin_calendar: yes
          plugin_calendar_limit: 0

          # Stargazers charts over 60 days
          plugin_stargazers: yes
          plugin_stargazers_days: 60

          # Followers / following avatars
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 26
          plugin_people_size: 28
