name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"      # every 24 hours (00:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F6821F&color_dots=#ebedf0,#fcd5b0,#f9ac6a,#F6821F,#C2410C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F6821F&color_dots=#161b22,#5c2e0e,#9a4a13,#d26a18,#F6821F

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
